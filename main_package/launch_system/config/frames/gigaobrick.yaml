# ===========================================================================
# Рама «Гигаобрик» — 5" (пропеллеры 5.1" Gemfan 51466), база 250 мм
# (моторный прямоугольник 209.4 × 137.9 мм). Плата: Orange Pi 5 Pro (RK3588S);
# камеры CSI: OV13855 (основная), IMX415 (экспериментальная); USB — fallback.
#
# Схема файла и механика применения — см. frames/obrick.yaml.
#
# Источник значений: CAD Fusion «Гигаобрик змейка 15.07 v25», ±2 мм
# (Позиции_сенсоров_Обрик_Гигаобрик.md, 2026-07-18). CAD даёт FRD от центра
# платы полётника (Matek H743 Mini) — ВАЖНО: полётник смещён на 53.3 мм назад
# от центра моторного прямоугольника, все статики ниже уже это учитывают
# (отсчёт от полётника = base_link). Оси здесь — FLU (y и z с обратным знаком
# от CAD). Камеры Orange Pi в CAD упрощены до плоского модуля: точка — по
# передней/нижней плоскости модуля, уточнение по реальной линзе ±5 мм.
# ===========================================================================
frame: gigaobrick

cameras:
  # Нижняя камера (OPi-модуль, смотрит вниз) — первая в списке: её статики
  # берёт текущий одно-камерный пайплайн (aruco/VPE, camera_id=1).
  # CAD FRD: (+129.9, 0.0, +30.2) мм, нижняя плоскость модуля.
  - id: 1
    tf:
      x: 0.1299
      y: 0.0
      z: -0.0302
      roll: 3.1415926           # оптическая ось вниз
      pitch: 0.0
      yaw: -1.5707963

  # Передняя камера (OPi-модуль, смотрит вперёд без наклона) — второй
  # мьюнт; задействуется при переходе на двухкамерную схему (camera_id=2).
  # CAD FRD: (+171.1, 0.0, −2.6) мм — выше центра платы полётника.
  - id: 2
    tf:
      x: 0.1711
      y: 0.0
      z: 0.0026
      roll: -1.5707963          # оптическая ось вперёд
      pitch: 0.0
      yaw: -1.5707963

# --- Справочно: позиции для PX4-параметров (launch их не читает) -----------
# От центра платы полётника, оси FRD, метры (ЦТ этой CAD-модели не
# калиброван — при заполнении SENS_FLOW_POS_*/EKF2_*_POS_* пересчитать от ЦТ,
# когда он появится):
#   optical flow MTF-01:  x +0.1473  y 0.0  z +0.0357  (смотрит вниз, СПЕРЕДИ;
#     окна flow и ToF разнесены на y = ±0.005 от этой точки)
#   камера нижняя:        x +0.1299  y 0.0  z +0.0302
#   камера передняя:      x +0.1711  y 0.0  z -0.0026

# Baseline PX4-параметров гигаобрика появится в fmu/frames/gigaobrick/
# (справочно, для ручной загрузки через QGC).
px4_baseline: fmu/frames/gigaobrick/
