# ===========================================================================
# Рама «Обрик» — платформа «Сверх» О-1, 2.5" пропеллеры, взлётная масса 284 г.
# Платы: Raspberry Pi 5 (imx219 | ov5647), Orange Pi Zero 3W (imx219).
#
# Геометрия рамы для full_system_real.launch.py: выбирается через
# SVERK_FRAME=obrick в env контейнера (пишет тип frame_obrick,
# image_builder/types.yaml → device .env). Один источник истины для статиков:
# launch передаёт tf_* аргументами в camera.launch.py драйвера
# (mipi_csi_cam_ros2 / a733_csi_cam_ros2 публикуют static TF сами), а для
# плат без своего публикатора (RDK) поднимает static_transform_publisher.
#
# Источник значений: CAD Fusion «Масса-габаритная модель v3», замер по граням
# линз/модулей, точность ±2 мм (Позиции_сенсоров_Обрик_Гигаобрик.md,
# 2026-07-18). CAD даёт FRD от центра платы полётника (Matek H743 Mini);
# здесь оси base_link — FLU (x вперёд, y ВЛЕВО, z ВВЕРХ): y и z с обратным
# знаком. Ориентация — оптический фрейм (z вдоль оптической оси, x вправо,
# y вниз): «вперёд» = roll -pi/2, yaw -pi/2; «вниз» = roll pi, yaw -pi/2.
# ===========================================================================
frame: obrick

cameras:
  - id: 1                       # camera_1 → /camera_1/image_raw, camera_optical_1
    # Позиция — CAD FRD: (+73.5, 0.0, +21.2) мм, передний торец линзы.
    # Ориентация — ВНИЗ (подтверждено пользователем; пометка «вперёд» в
    # CAD-файле — ошибка): roll pi, yaw -pi/2, как исторически в launch.
    tf:
      x: 0.0655                 # м, вперёд от центра платы полётника
      y: 0.0
      z: -0.0337                # м (FLU: ниже центра платы полётника)
      roll: 3.1415926           # оптическая ось вниз
      pitch: 0.0
      yaw: -1.5707963

# --- Справочно: позиции для PX4-параметров (launch их не читает) -----------
# От ЦЕНТРА ТЯЖЕСТИ взлётной конфигурации, оси FRD, метры — как того требуют
# SENS_FLOW_POS_* / EKF2_OF_POS_* / EKF2_RNG_POS_* / EKF2_EV_POS_*:
#   камера (край линзы):      x +0.0683  y +0.0002  z +0.0150
#   optical flow MTF-02P:     x -0.0539  y +0.0045  z +0.0183   (смотрит вниз, сзади)
#   ToF-дальномер MTF-02P:    x -0.0470  y +0.0041  z +0.0199   (смотрит вниз)
# Эти значения должны попасть в baseline (см. px4_baseline ниже).

# Справочный baseline PX4-параметров рамы (пользователь грузит сам через QGC:
# Vehicle Setup → Parameters → Load from file; автозаливки нет).
px4_baseline: fmu/frames/obrick/stable_1_15_4.params
