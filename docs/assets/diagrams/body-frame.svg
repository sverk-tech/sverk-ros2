<svg viewBox="0 0 420 300" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif">
<title>Система координат body (FLU) — вид сверху</title>
<desc>Система координат body: X вперёд, Y влево, Z вверх. FLU-ориентация по стандарту ROS REP-103.</desc>
<style>
.t{font-size:12px;font-weight:600;fill:#111827}
.d{font-size:10.5px;fill:#6b7280}
.ax{font-size:13px;font-weight:700}
</style>
<!-- arms -->
<line x1="170" y1="120" x2="130" y2="90"  stroke="#c7d2fe" stroke-width="8" stroke-linecap="round"/>
<line x1="250" y1="120" x2="290" y2="90"  stroke="#c7d2fe" stroke-width="8" stroke-linecap="round"/>
<line x1="170" y1="180" x2="130" y2="210" stroke="#c7d2fe" stroke-width="8" stroke-linecap="round"/>
<line x1="250" y1="180" x2="290" y2="210" stroke="#c7d2fe" stroke-width="8" stroke-linecap="round"/>
<!-- motors -->
<circle cx="126" cy="87"  r="14" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<circle cx="294" cy="87"  r="14" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<circle cx="126" cy="213" r="14" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<circle cx="294" cy="213" r="14" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<!-- drone body -->
<rect x="170" y="120" width="80" height="60" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
<text class="t" x="210" y="156" text-anchor="middle">дрон</text>
<!-- X axis: forward -->
<line x1="210" y1="120" x2="210" y2="30" stroke="#374151" stroke-width="2"/>
<text class="ax" x="222" y="26" fill="#374151">X</text>
<text class="d"  x="222" y="42">вперёд</text>
<!-- Y axis: left -->
<line x1="170" y1="150" x2="60" y2="150" stroke="#374151" stroke-width="2"/>
<text class="ax" x="38" y="146" fill="#374151">Y</text>
<text class="d"  x="28" y="162">влево</text>
<!-- right label -->
<text class="d" x="265" y="162" fill="#9ca3af">вправо</text>
<!-- Z note -->
<text class="d" x="210" y="268" text-anchor="middle" fill="#374151">Z — вверх (перпендикулярно плоскости)</text>
<text x="210" y="286" text-anchor="middle" font-size="10.5" fill="#6b7280">FLU: Forward – Left – Up · стандарт ROS REP-103</text>
</svg>
