<svg viewBox="0 0 540 220" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif">
<title>Схема подключения электромагнита</title>
<desc>Внешнее питание 5В подаётся на плюс электромагнита. GPIO23 Обрика управляет транзисторным ключом, который замыкает минус. GND объединены.</desc>
<style>
.b{fill:#f3f4f6;stroke:#d1d5db;stroke-width:1.5}
.a{fill:#eef2ff;stroke:#c7d2fe;stroke-width:1.5}
.w{fill:#fef9c3;stroke:#fde68a;stroke-width:1.5}
.t{font-size:12px;font-weight:600;fill:#111827}
.d{font-size:10.5px;fill:#6b7280}
.c{font-family:ui-monospace,Menlo,monospace;font-size:10px;fill:#374151}
</style>
<g text-anchor="middle">
<rect class="w" x="10" y="16" width="120" height="54" rx="9"/>
<text class="t" x="70" y="38">Внешнее питание</text>
<text class="d" x="70" y="54">5 В</text>
<rect class="b" x="10" y="140" width="120" height="54" rx="9"/>
<text class="t" x="70" y="162">Обрик</text>
<text class="c" x="70" y="178">GPIO23 + GND</text>
<rect class="b" x="220" y="90" width="100" height="44" rx="9"/>
<text class="t" x="270" y="110">Ключ</text>
<text class="d" x="270" y="124">транзистор</text>
<rect class="a" x="390" y="16" width="140" height="114" rx="9"/>
<text class="t" x="460" y="42">Электромагнит</text>
<text class="d" x="460" y="60">(+) ← внешнее 5В</text>
<text class="d" x="460" y="76">~ катушка</text>
<text class="d" x="460" y="92">(−) ← ключ</text>
<text class="d" x="460" y="110">GND общий</text>
<line x1="130" y1="36" x2="390" y2="36" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="130" y1="54" x2="220" y2="112" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="130" y1="162" x2="220" y2="112" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="320" y1="112" x2="390" y2="92" stroke="#9ca3af" stroke-width="1.5"/>
<text x="270" y="192" font-size="10.5" fill="#9ca3af">GND объединены (общая земля)</text>
</g>
</svg>
