<svg viewBox="0 0 560 120" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif">
<title>Цепочка управления дроном через ROS 2</title>
<desc>Программа на Python вызывает sverk_interfaces, которая обращается к ноде offboard_control, которая управляет PX4.</desc>
<style>
.b{fill:#f3f4f6;stroke:#d1d5db;stroke-width:1.5}
.a{fill:#eef2ff;stroke:#c7d2fe;stroke-width:1.5}
.t{font-size:12px;font-weight:600;fill:#111827}
.d{font-size:10.5px;fill:#6b7280}
.c{font-family:ui-monospace,Menlo,monospace;font-size:10px;fill:#374151}
</style>
<g text-anchor="middle">
<rect class="a" x="10" y="20" width="150" height="66" rx="9"/>
<text class="t" x="85" y="45">Программа</text>
<text class="c" x="85" y="62">navigate(z=1.5)</text>
<text class="d" x="85" y="78">ваш Python-код</text>
<line x1="160" y1="53" x2="195" y2="53" stroke="#9ca3af" stroke-width="1.5"/>
<rect class="b" x="195" y="20" width="160" height="66" rx="9"/>
<text class="t" x="275" y="45">offboard_control</text>
<text class="c" x="275" y="62">сервис /navigate</text>
<text class="d" x="275" y="78">нода ROS 2</text>
<line x1="355" y1="53" x2="390" y2="53" stroke="#9ca3af" stroke-width="1.5"/>
<rect class="b" x="390" y="20" width="160" height="66" rx="9"/>
<text class="t" x="470" y="45">PX4 FMU</text>
<text class="c" x="470" y="62">TrajectorySetpoint</text>
<text class="d" x="470" y="78">моторы</text>
</g>
</svg>
