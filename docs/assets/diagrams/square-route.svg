<svg viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif">
<title>Маршрут дрона — квадрат</title>
<desc>Дрон облетает квадрат со стороной 1 метр, возвращаясь в точку старта.</desc>
<style>
.b{fill:#f3f4f6;stroke:#d1d5db;stroke-width:1.5}
.a{fill:#eef2ff;stroke:#c7d2fe;stroke-width:1.5}
.t{font-size:11px;font-weight:600;fill:#111827}
.d{font-size:10px;fill:#6b7280}
.c{font-family:ui-monospace,Menlo,monospace;font-size:9.5px;fill:#374151}
</style>
<line x1="80" y1="240" x2="260" y2="240" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4"/>
<line x1="260" y1="240" x2="260" y2="80" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4"/>
<line x1="260" y1="80" x2="80" y2="80" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4"/>
<line x1="80" y1="80" x2="80" y2="240" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4"/>
<text class="d" x="170" y="258">→ +X</text>
<text class="d" x="270" y="165">↑ +Y</text>
<text class="d" x="170" y="72">← −X</text>
<text class="d" x="30" y="165">↓ −Y</text>
<circle cx="80" cy="240" r="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
<text class="t" x="80" y="244" text-anchor="middle">1</text>
<text class="c" x="80" y="262" text-anchor="middle">старт</text>
<text class="c" x="80" y="273" text-anchor="middle">x0, y0</text>
<circle cx="260" cy="240" r="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<text class="t" x="260" y="244" text-anchor="middle">2</text>
<text class="c" x="260" y="262" text-anchor="middle">x0+1, y0</text>
<circle cx="260" cy="80" r="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<text class="t" x="260" y="84" text-anchor="middle">3</text>
<text class="c" x="260" y="66" text-anchor="middle">x0+1, y0+1</text>
<circle cx="80" cy="80" r="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<text class="t" x="80" y="84" text-anchor="middle">4</text>
<text class="c" x="80" y="66" text-anchor="middle">x0, y0+1</text>
<text x="180" y="300" text-anchor="middle" font-size="10" fill="#6b7280">замкнутый маршрут · сторона квадрата 1 м</text>
</svg>
