<svg viewBox="0 0 460 370" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif">
<title>Стек камеры Обрика</title>
<desc>Кадры с физической камеры проходят через драйвер libcamera, ноду camera_ros2 и попадают в топик ROS 2, откуда их читает код через cv_bridge.</desc>
<style>.b{fill:#f3f4f6;stroke:#d1d5db;stroke-width:1.5}.a{fill:#eef2ff;stroke:#c7d2fe;stroke-width:1.5}.t{font-size:13px;font-weight:600;fill:#111827}.d{font-size:11px;fill:#6b7280}.c{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;fill:#374151}</style>
<g text-anchor="middle">
<rect class="a" x="70" y="16" width="320" height="44" rx="9"/><text class="t" x="230" y="43">Физическая камера (MIPI CSI)</text>
<line x1="230" y1="60" x2="230" y2="82" stroke="#9ca3af" stroke-width="1.5"/>
<rect class="b" x="70" y="82" width="320" height="48" rx="9"/><text class="t" x="230" y="103">libcamera / v4l2</text><text class="d" x="230" y="120">драйвер захвата кадров</text>
<line x1="230" y1="130" x2="230" y2="152" stroke="#9ca3af" stroke-width="1.5"/>
<rect class="b" x="70" y="152" width="320" height="58" rx="9"/><text class="t" x="230" y="172">драйвер камеры</text><text class="c" x="230" y="189">mipi_csi_cam_ros2 (RPi/RK3588S)</text><text class="c" x="230" y="204">a733_csi_cam_ros2 (Orange Pi Zero 3W)</text>
<line x1="230" y1="210" x2="230" y2="232" stroke="#9ca3af" stroke-width="1.5"/>
<rect class="b" x="70" y="232" width="320" height="44" rx="9"/><text class="c" x="230" y="253">/camera_1/image_raw</text><text class="d" x="230" y="269">sensor_msgs/Image</text>
<line x1="230" y1="276" x2="230" y2="298" stroke="#9ca3af" stroke-width="1.5"/>
<rect class="a" x="70" y="298" width="320" height="44" rx="9"/><text class="t" x="230" y="325">Код: cv_bridge → OpenCV</text>
</g>
</svg>
