<svg viewBox="0 0 540 160" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif">
<title>Подключение LED-ленты WS2812B</title>
<desc>LED-лента WS2812B подключается к бортовому компьютеру: данные на MOSI (SPI0), питание 5В, общая земля.</desc>
<text x="120" y="26" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Бортовой компьютер</text>
<text x="410" y="26" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">LED-лента WS2812B</text>
<g font-size="12.5" fill="#111827">
<text x="120" y="64" text-anchor="middle" font-weight="600">MOSI (пин 19, SPI0)</text><line x1="220" y1="60" x2="320" y2="60" stroke="#9ca3af" stroke-width="1.5"/><text x="410" y="64" text-anchor="middle">DIN (вход данных)</text>
<text x="120" y="104" text-anchor="middle" font-weight="600">5 В</text><line x1="220" y1="100" x2="320" y2="100" stroke="#9ca3af" stroke-width="1.5"/><text x="410" y="104" text-anchor="middle">+5 В (питание)</text>
<text x="120" y="144" text-anchor="middle" font-weight="600">GND</text><line x1="220" y1="140" x2="320" y2="140" stroke="#9ca3af" stroke-width="1.5"/><text x="410" y="144" text-anchor="middle">GND (земля)</text>
</g>
</svg>
