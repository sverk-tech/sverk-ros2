<svg viewBox="0 0 480 110" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif">
<title>Состав бортового компьютера Обрика</title>
<desc>Бортовой компьютер состоит из вычислительного модуля и платы расширения.</desc>
<style>
.b{fill:#f3f4f6;stroke:#d1d5db;stroke-width:1.5}
.t{font-size:12px;font-weight:600;fill:#111827}
.d{font-size:10.5px;fill:#6b7280}
</style>
<g text-anchor="middle">
<rect class="b" x="20" y="14" width="190" height="66" rx="9"/>
<text class="t" x="115" y="40">Вычислительный модуль</text>
<text class="d" x="115" y="56">Raspberry Pi CM5 / Radxa CM5</text>
<text class="d" x="115" y="70">Orange Pi Zero 3W / 5 Pro / RDK X3</text>
<text x="236" y="52" font-size="18" fill="#9ca3af">+</text>
<rect class="b" x="252" y="14" width="210" height="66" rx="9"/>
<text class="t" x="357" y="40">Плата расширения</text>
<text class="d" x="357" y="56">55 × 40 мм, ~20 г</text>
<text class="d" x="357" y="70">GPIO, CSI, USB, Ethernet</text>
<text x="240" y="98" text-anchor="middle" font-size="10.5" fill="#6b7280">Вариант модуля зависит от комплектации</text>
</g>
</svg>
