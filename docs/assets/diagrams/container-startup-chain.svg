<svg viewBox="0 0 540 430" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif">
<title>Цепочка запуска контейнера и launch-файла</title>
<style>
.b{fill:#f3f4f6;stroke:#d1d5db;stroke-width:1.5}
.a{fill:#eef2ff;stroke:#c7d2fe;stroke-width:1.5}
.g{fill:#f0fdf4;stroke:#86efac;stroke-width:1.5}
.t{font-size:12px;font-weight:600;fill:#111827;text-anchor:middle}
.c{font-family:ui-monospace,Menlo,monospace;font-size:10px;fill:#111827;text-anchor:middle}
.cl{font-family:ui-monospace,Menlo,monospace;font-size:9.5px;fill:#374151;text-anchor:middle}
.lbl{font-size:10px;fill:#6b7280;text-anchor:middle}
.ln{stroke:#9ca3af;stroke-width:1.5;fill:none}
</style>

<rect class="b" x="50" y="16" width="440" height="34" rx="8"/>
<text class="t" x="270" y="37">Включение платы</text>
<line x1="270" y1="50" x2="270" y2="70" class="ln"/>

<rect class="b" x="50" y="70" width="440" height="40" rx="8"/>
<text class="c" x="270" y="88">systemd-юнит sverk-ros2-docker.service</text>
<text class="lbl" x="270" y="103">на хосте · ExecStart: docker compose … up -d</text>
<line x1="270" y1="110" x2="270" y2="130" class="ln"/>

<rect class="a" x="50" y="130" width="440" height="90" rx="8"/>
<text class="c" x="270" y="149">Контейнер sverk_ros2 → scripts/start.sh</text>
<text class="lbl" x="270" y="169">даёт доступ к железу платы (/dev/*)</text>
<text class="lbl" x="270" y="186">поднимает SSH-доступ к контейнеру</text>
<text class="lbl" x="270" y="203">запускает веб-терминал и редактор кода в браузере</text>
<line x1="270" y1="220" x2="270" y2="240" class="ln"/>

<rect class="b" x="50" y="240" width="440" height="40" rx="8"/>
<text class="c" x="270" y="258">загружает окружение ROS 2</text>
<text class="lbl" x="270" y="273">source /opt/ros/humble + ~/sverk_ws/install</text>
<line x1="270" y1="280" x2="270" y2="300" class="ln"/>

<rect class="a" x="50" y="300" width="440" height="40" rx="8"/>
<text class="c" x="270" y="318">ros2 launch launch_system</text>
<text class="lbl" x="270" y="333">главный launch-файл · в фоне</text>
<line x1="270" y1="340" x2="270" y2="360" class="ln"/>

<rect class="g" x="50" y="360" width="440" height="40" rx="8"/>
<text class="t" x="270" y="380">Все ноды дрона работают</text>
<text class="lbl" x="270" y="394">камера, offboard_control, лента и др.</text>
</svg>
