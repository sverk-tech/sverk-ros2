<svg viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif">
<title>Подключение пищалки к балансировочному разъёму</title>
<desc>Пищалка подключается к балансировочному разъёму LiPo аккумулятора и пищит при падении напряжения ниже порога.</desc>
<style>
.b{fill:#f3f4f6;stroke:#d1d5db;stroke-width:1.5}
.a{fill:#eef2ff;stroke:#c7d2fe;stroke-width:1.5}
.t{font-size:12px;font-weight:600;fill:#111827}
.d{font-size:10.5px;fill:#6b7280}
</style>
<g text-anchor="middle">
<rect class="b" x="20" y="60" width="140" height="80" rx="9"/>
<text class="t" x="90" y="90">LiPo 3S</text>
<text class="d" x="90" y="108">аккумулятор</text>
<line x1="160" y1="80" x2="200" y2="80" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="160" y1="120" x2="200" y2="120" stroke="#9ca3af" stroke-width="1.5"/>
<rect class="b" x="200" y="62" width="120" height="36" rx="9"/>
<text class="t" x="260" y="84">Силовой разъём</text>
<rect class="b" x="200" y="102" width="120" height="36" rx="9"/>
<text class="t" x="260" y="119">Балансировочный</text>
<text class="d" x="260" y="132">разъём</text>
<line x1="320" y1="120" x2="360" y2="120" stroke="#9ca3af" stroke-width="1.5"/>
<rect class="a" x="360" y="88" width="100" height="64" rx="9"/>
<text class="t" x="410" y="114">Пищалка</text>
<text class="d" x="410" y="130">порог: 3.5–3.6 В</text>
<text class="d" x="410" y="144">на ячейку</text>
</g>
</svg>
