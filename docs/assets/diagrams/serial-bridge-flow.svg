<svg viewBox="0 0 580 240" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif">
<title>Связь Обрика и Arduino через serial_bridge</title>
<style>
.a{fill:#eef2ff;stroke:#c7d2fe;stroke-width:1.5}
.b{fill:#f3f4f6;stroke:#d1d5db;stroke-width:1.5}
.t{font-size:12px;font-weight:600;fill:#111827;text-anchor:middle}
.lbl{font-size:10px;fill:#6b7280;text-anchor:middle}
.cl{font-family:ui-monospace,Menlo,monospace;font-size:10px;fill:#374151;text-anchor:middle}
.ln{stroke:#9ca3af;stroke-width:1.5;fill:none}
</style>

<rect class="a" x="20" y="22" width="215" height="46" rx="8"/>
<text class="t" x="127" y="43">Обрик (бортовой компьютер)</text>
<text class="cl" x="127" y="59">ROS 2 нода serial_bridge</text>

<rect class="b" x="345" y="22" width="215" height="46" rx="8"/>
<text class="t" x="452" y="43">Arduino</text>
<text class="cl" x="452" y="59">программа Arduino</text>

<line x1="235" y1="45" x2="345" y2="45" class="ln"/>
<text class="lbl" x="290" y="36">USB / UART</text>

<line x1="127" y1="68" x2="127" y2="110" class="ln"/>
<line x1="452" y1="68" x2="452" y2="110" class="ln"/>

<rect class="b" x="20" y="110" width="215" height="46" rx="8"/>
<text class="t" x="127" y="131">Топики ROS 2</text>
<text class="lbl" x="127" y="147">команды и данные</text>

<rect class="b" x="345" y="110" width="215" height="46" rx="8"/>
<text class="t" x="452" y="131">Управление устройством</text>
<text class="lbl" x="452" y="147">мотор, датчик, LED…</text>

<text class="lbl" x="290" y="192">serial_bridge переводит данные между топиками ROS 2</text>
<text class="lbl" x="290" y="207">и последовательным портом Arduino в обе стороны</text>
</svg>
