<svg viewBox="0 0 600 170" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif">
<title>Связь QGroundControl с Обриком</title>
<desc>Программа QGroundControl на компьютере соединяется с полётным контроллером PX4 Обрика по Wi-Fi.</desc>
<g>
<rect x="36" y="46" width="210" height="80" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<text x="141" y="80" text-anchor="middle" font-size="13.5" font-weight="600" fill="#111827">Ваш компьютер</text>
<text x="141" y="101" text-anchor="middle" font-size="12" fill="#6b7280">QGroundControl (QGC)</text>
</g>
<g>
<rect x="354" y="46" width="210" height="80" rx="10" fill="#eef2ff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="459" y="80" text-anchor="middle" font-size="13.5" font-weight="600" fill="#111827">Обрик</text>
<text x="459" y="101" text-anchor="middle" font-size="12" fill="#6b7280">полётный контроллер PX4</text>
</g>
<line x1="246" y1="86" x2="354" y2="86" stroke="#9ca3af" stroke-width="1.5"/>
<text x="300" y="78" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Wi-Fi</text>
<text x="300" y="102" text-anchor="middle" font-size="10.5" fill="#6b7280">UDP</text>
</svg>
