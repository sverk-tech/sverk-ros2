<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif">
<title>Устройство Обрика</title>
<desc>Полётный контроллер PX4 и бортовой компьютер связаны по UART; контроллер управляет моторами, компьютер — камерой и датчиками.</desc>
<g>
<rect x="40" y="24" width="240" height="72" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<text x="160" y="52" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Полётный контроллер</text>
<text x="160" y="74" text-anchor="middle" font-size="12" fill="#6b7280">PX4 Autopilot</text>
</g>
<g>
<rect x="360" y="24" width="240" height="72" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<text x="480" y="52" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Бортовой компьютер</text>
<text x="480" y="74" text-anchor="middle" font-size="12" fill="#6b7280">Ubuntu · ROS 2 · Docker</text>
</g>
<line x1="280" y1="60" x2="360" y2="60" stroke="#6b7280" stroke-width="1.5"/>
<text x="320" y="51" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">UART</text>
<text x="320" y="75" text-anchor="middle" font-size="10" fill="#6b7280">uXRCE-DDS</text>
<line x1="160" y1="96" x2="160" y2="150" stroke="#6b7280" stroke-width="1.5"/>
<line x1="480" y1="96" x2="480" y2="150" stroke="#6b7280" stroke-width="1.5"/>
<g>
<rect x="40" y="150" width="240" height="72" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
<text x="160" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">4 мотора + пропеллеры</text>
<text x="160" y="200" text-anchor="middle" font-size="12" fill="#6b7280">регуляторы ESC</text>
</g>
<g>
<rect x="360" y="150" width="240" height="72" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
<text x="480" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Камера + датчики</text>
<text x="480" y="200" text-anchor="middle" font-size="12" fill="#6b7280">ArUco, дальномер, GPS</text>
</g>
</svg>
