<svg viewBox="0 0 680 284" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif">
<title>Полётный контроллер PX4</title>
<desc>Данные гироскопа, акселерометра и барометра объединяет фильтр EKF2 в позицию и ориентацию; команды от пульта и ROS 2 преобразуются в сигналы PWM на регуляторы моторов.</desc>
<rect x="16" y="16" width="648" height="252" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="340" y="44" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">ПОЛЁТНЫЙ КОНТРОЛЛЕР (PX4)</text>
<line x1="40" y1="58" x2="640" y2="58" stroke="#e5e7eb" stroke-width="1"/>

<!-- sensors -->
<g font-size="13" fill="#111827">
<text x="56" y="96">Гироскоп</text><text x="150" y="96" fill="#6b7280" font-size="12">угловые скорости</text>
<text x="56" y="126">Акселерометр</text><text x="150" y="126" fill="#6b7280" font-size="12">ускорения</text>
<text x="56" y="156">Барометр</text><text x="150" y="156" fill="#6b7280" font-size="12">высота</text>
</g>
<!-- lines sensors -> EKF2 -->
<line x1="270" y1="92" x2="380" y2="118" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="270" y1="122" x2="380" y2="123" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="270" y1="152" x2="380" y2="128" stroke="#9ca3af" stroke-width="1.5"/>

<!-- EKF2 -->
<rect x="380" y="100" width="92" height="46" rx="9" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
<text x="426" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">EKF2</text>
<!-- EKF2 -> result -->
<line x1="472" y1="123" x2="520" y2="123" stroke="#9ca3af" stroke-width="1.5"/>
<text x="528" y="119" font-size="12.5" fill="#111827">Позиция</text>
<text x="528" y="135" font-size="12.5" fill="#111827">и ориентация</text>

<!-- bottom flow -->
<rect x="56" y="196" width="190" height="60" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<text x="151" y="222" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Команды</text>
<text x="151" y="241" text-anchor="middle" font-size="12" fill="#6b7280">от пульта и ROS 2</text>

<line x1="246" y1="226" x2="408" y2="226" stroke="#9ca3af" stroke-width="1.5"/>

<rect x="408" y="196" width="216" height="60" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<text x="516" y="222" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">4 сигнала PWM</text>
<text x="516" y="241" text-anchor="middle" font-size="12" fill="#6b7280">на ESC и моторы</text>
</svg>
