<svg viewBox="0 0 660 296" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif">
<title>Интерфейсы GPIO бортового компьютера</title>
<desc>Бортовой компьютер подключает периферию через GPIO, PWM, I2C, SPI, UART и USB.</desc>
<rect x="24" y="104" width="160" height="80" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
<text x="104" y="140" text-anchor="middle" font-size="13.5" font-weight="600" fill="#111827">Бортовой</text>
<text x="104" y="159" text-anchor="middle" font-size="13.5" font-weight="600" fill="#111827">компьютер</text>
<g font-size="12" fill="#111827">
<line x1="184" y1="34"  x2="330" y2="34"  stroke="#9ca3af" stroke-width="1.5"/><text x="257" y="28" text-anchor="middle" font-weight="600">GPIO</text>
<rect x="330" y="18" width="306" height="32" rx="7" fill="#f3f4f6" stroke="#d1d5db"/><text x="342" y="39">Кнопки, светодиоды, реле</text>
<line x1="184" y1="76"  x2="330" y2="76"  stroke="#9ca3af" stroke-width="1.5"/><text x="240" y="70" text-anchor="middle" font-weight="600">PWM (12/13)</text>
<rect x="330" y="60" width="306" height="32" rx="7" fill="#f3f4f6" stroke="#d1d5db"/><text x="342" y="81">Сервоприводы</text>
<line x1="184" y1="118" x2="330" y2="118" stroke="#9ca3af" stroke-width="1.5"/><text x="244" y="112" text-anchor="middle" font-weight="600">I2C (2/3)</text>
<rect x="330" y="102" width="306" height="32" rx="7" fill="#f3f4f6" stroke="#d1d5db"/><text x="342" y="123">Датчики (VL53L1X, IMU)</text>
<line x1="184" y1="160" x2="330" y2="160" stroke="#9ca3af" stroke-width="1.5"/><text x="240" y="154" text-anchor="middle" font-weight="600">SPI (10/20)</text>
<rect x="330" y="144" width="306" height="32" rx="7" fill="#f3f4f6" stroke="#d1d5db"/><text x="342" y="165">LED-лента WS2812B</text>
<line x1="184" y1="202" x2="330" y2="202" stroke="#9ca3af" stroke-width="1.5"/><text x="236" y="196" text-anchor="middle" font-weight="600">UART (14/15)</text>
<rect x="330" y="186" width="306" height="32" rx="7" fill="#f3f4f6" stroke="#d1d5db"/><text x="342" y="207">Полётный контроллер</text>
<line x1="184" y1="244" x2="330" y2="244" stroke="#9ca3af" stroke-width="1.5"/><text x="257" y="238" text-anchor="middle" font-weight="600">USB</text>
<rect x="330" y="228" width="306" height="32" rx="7" fill="#f3f4f6" stroke="#d1d5db"/><text x="342" y="249">Arduino, лидар LD19</text>
<line x1="184" y1="144" x2="184" y2="34" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="184" y1="144" x2="184" y2="244" stroke="#9ca3af" stroke-width="1.5"/>
</g>
</svg>
