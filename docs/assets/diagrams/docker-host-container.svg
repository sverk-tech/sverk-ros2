<svg viewBox="0 0 600 490" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif">
<title>Схема подключений: плата и Docker-контейнер</title>
<style>
.b{fill:#f3f4f6;stroke:#d1d5db;stroke-width:1.5}
.a{fill:#eef2ff;stroke:#c7d2fe;stroke-width:1.5}
.t{font-size:12px;font-weight:700;fill:#111827}
.lbl{font-size:10px;fill:#6b7280}
.c{font-family:ui-monospace,Menlo,monospace;font-size:10px;fill:#374151}
.cg{font-family:ui-monospace,Menlo,monospace;font-size:10px;fill:#15803d}
.sep{stroke:#e5e7eb;stroke-width:1}
</style>
<rect class="b" x="10" y="10" width="580" height="210" rx="10"/>
<text class="t" x="300" y="32" text-anchor="middle">Плата (хост)</text>
<text class="lbl" x="20" y="52">Интерфейс</text>
<text class="lbl" x="210" y="52">/dev/ файл</text>
<text class="lbl" x="420" y="52">Устройство</text>
<line x1="10" y1="57" x2="590" y2="57" class="sep"/>
<text class="c" x="20" y="74">UART_A TX/RX</text>
<text class="c" x="210" y="74">/dev/ttyAMA0</text>
<text class="cg" x="420" y="74">PX4 (MAVLink)</text>
<text class="c" x="20" y="95">UART_B TX/RX</text>
<text class="c" x="210" y="95">/dev/ttyAMA10</text>
<text class="cg" x="420" y="95">Arduino / GPS</text>
<text class="c" x="20" y="116">SPI MOSI/SCK/CS</text>
<text class="c" x="210" y="116">/dev/spidev1.0</text>
<text class="cg" x="420" y="116">LED WS2812B</text>
<text class="c" x="20" y="137">GPIO12 (PWM)</text>
<text class="c" x="210" y="137">gpiochip0 line 12</text>
<text class="cg" x="420" y="137">Сервопривод</text>
<text class="c" x="20" y="158">CSI шлейф</text>
<text class="c" x="210" y="158">/dev/video0</text>
<text class="cg" x="420" y="158">Камера IMX219</text>
<text class="c" x="20" y="179">I2C SDA/SCL</text>
<text class="c" x="210" y="179">/dev/i2c-1</text>
<text class="cg" x="420" y="179">VL53L1X / Баро</text>
<text class="c" x="20" y="200">/dev/gpiochip0</text>
<text class="c" x="210" y="200">libgpiod</text>
<text class="cg" x="420" y="200">GPIO пины</text>
<text class="lbl" x="300" y="217" text-anchor="middle">все устройства проброшены в контейнер sverk_ros2</text>
<line x1="300" y1="220" x2="300" y2="258" stroke="#9ca3af" stroke-width="1.5"/>
<text class="lbl" x="310" y="244">docker volumes / devices</text>
<rect class="a" x="10" y="260" width="580" height="220" rx="10"/>
<text class="t" x="300" y="282" text-anchor="middle">Контейнер sverk_ros2</text>
<text class="lbl" x="20" y="302">/dev/ файл</text>
<text class="lbl" x="220" y="302">Нода</text>
<text class="lbl" x="420" y="302">ROS 2 топик</text>
<line x1="10" y1="307" x2="590" y2="307" class="sep"/>
<text class="c" x="20" y="324">/dev/ttyAMA0</text>
<text class="c" x="220" y="324">mavlink-router → px4_ros2_bridge</text>
<text class="cg" x="420" y="324">/fmu/out/…</text>
<text class="c" x="20" y="345">/dev/ttyAMA10</text>
<text class="c" x="220" y="345">serial_bridge / GPS-нод</text>
<text class="cg" x="420" y="345">/serial/rx</text>
<text class="c" x="20" y="366">/dev/spidev1.0</text>
<text class="c" x="220" y="366">LED-нод (gpiod + spidev)</text>
<text class="cg" x="420" y="366">/led/set_effect</text>
<text class="c" x="20" y="387">gpiochip0 line 12</text>
<text class="c" x="220" y="387">servo_node (rpi_hardware_pwm)</text>
<text class="cg" x="420" y="387">/servo_node/…</text>
<text class="c" x="20" y="408">/dev/video0</text>
<text class="c" x="220" y="408">camera-нод (libcamera)</text>
<text class="cg" x="420" y="408">/camera_1/image_raw</text>
<text class="c" x="20" y="429">/dev/i2c-1</text>
<text class="c" x="220" y="429">vl53l1x-нод</text>
<text class="cg" x="420" y="429">/drone/range</text>
<text class="c" x="20" y="450">/dev/gpiochip0</text>
<text class="c" x="220" y="450">gpio_service (libgpiod)</text>
<text class="cg" x="420" y="450">/gpio/pin_on, /gpio/pin_off</text>
<text class="lbl" x="300" y="472" text-anchor="middle">ROS 2 Humble · uXRCE-DDS · MicroXRCEAgent</text>
</svg>
