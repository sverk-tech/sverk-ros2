stages:
  - test
  - lint

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

test:
  stage: test
  image: python:3.12
  before_script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"
  script:
    - pytest tests/ -v --cov=pyuwb --cov-report=term --cov-report=xml --cov-fail-under=80
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

lint:
  stage: lint
  image: python:3.12
  before_script:
    - python -m pip install --upgrade pip
    - pip install flake8
  script:
    - flake8 src/ tests/ --max-line-length=120
  allow_failure: true

test:python37:
  stage: test
  image: python:3.7
  before_script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"
  script:
    - pytest tests/ -v
